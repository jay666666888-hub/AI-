# AI 开发生态系统 - 服务编排
version: '3.8'

services:
  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_ecosystem_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: ai_ecosystem_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./telemetry/grafana/provisioning:/etc/grafana/provisioning
      - ./telemetry/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - qdrant
      - influxdb
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uptime Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: ai_ecosystem_uptime_kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped

  # Secret Management (Dev mode)
  vault:
    image: hashicorp/vault:1.13
    container_name: ai_ecosystem_vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=vault_dev_token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file

  # Time Series Database (for ECE, calibration metrics)
  influxdb:
    image: influxdb:1.8
    container_name: ai_ecosystem_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminadmin
      - DOCKER_INFLUXDB_INIT_ORG=ecosystem
      - DOCKER_INFLUXDB_INIT_BUCKET=telmetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  grafana_data:
  uptime_kuma_data:
  vault_data:
  influxdb_data: